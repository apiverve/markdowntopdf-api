[project]
name = "apiverve-markdowntopdf"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Markdown to PDF is a PDF generator API that converts markdown text into professionally formatted PDF documents and returns a temporary download URL for each file."
keywords = ["pdf generator api", "markdown to pdf api", "markdown to pdf converter api", "pdf creator api", "free pdf generator api"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/markdowntopdf?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/markdowntopdf?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/markdowntopdf-api"
Twitter = "https://twitter.com/apivervehq"
